plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abosultan.darbakappmanager'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abosultan.darbakappmanager'
        minSdk 25
        targetSdk 25
        versionCode 2
        versionName '1.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        stable {
            def stablePath = System.getenv('KEYSTORE_PATH') ?: 'darbak-appmanager-stable.jks'
            storeFile file(stablePath)
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.stable
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
