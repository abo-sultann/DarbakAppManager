name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: darbak-app-manager-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed App Manager signing key
        run: |
          base64 --decode ci/darbak-appmanager-stable.jks.b64 > app/darbak-appmanager-stable.jks
          keytool -list -keystore app/darbak-appmanager-stable.jks -storepass android -alias androiddebugkey >/dev/null

      - name: Build signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/darbak-appmanager-stable.jks
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature and checksum
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          jarsigner -verify -certs "$APK" >/dev/null
          sha256sum "$APK"

      - name: Upload Stable APK
        uses: actions/upload-artifact@v4
        with:
          name: DarbakAppManager-Stable
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 1
          if-no-files-found: error

      - name: Publish in-app update payload
        if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          VERSION_CODE=$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" app/build.gradle | head -1)
          VERSION_NAME=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c%s "$APK")
          mkdir -p dist
          cp "$APK" dist/DarbakAppManager-latest.apk
          cat > update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "apkUrl": "https://raw.githubusercontent.com/abo-sultann/DarbakAppManager/main/dist/DarbakAppManager-latest.apk",
            "notes": "واجهة دربك المعتمدة، تحديث داخل التطبيق، وتحسينات الأمان والاستقرار.",
            "sha256": "${SHA}",
            "size": ${SIZE}
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/DarbakAppManager-latest.apk update.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish DarbakAppManager ${VERSION_NAME} [skip ci]"
            git push origin HEAD:main
          fi
